<!DOCTYPE html>
<html>
<head>
  <title>Jarvis Vision AI</title>
  <style>
    body {
      background: #020617;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    video {
      width: 400px;
      border: 2px solid cyan;
      border-radius: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      background: cyan;
      border: none;
      cursor: pointer;
    }

    input {
      padding: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>Jarvis Vision System</h1>

<video id="video" autoplay></video>
<br>

<input type="number" id="height" placeholder="Height in meters (e.g. 1.75)">
<br>

<button onclick="capture()">Scan</button>

<p id="result">Waiting...</p>

<script>
const API_URL = "https://jarvis-vision-be.onrender.com/predict"; // replace if needed

const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => video.srcObject = stream);

function capture() {
  const height = document.getElementById("height").value;

  if (!height) {
    alert("Enter height first");
    return;
  }

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  const image = canvas.toDataURL("image/jpeg");

  document.getElementById("result").innerText = "Processing...";

  fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ image, height })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      document.getElementById("result").innerText = "Error: " + data.error;
    } else {
      document.getElementById("result").innerText =
        `Weight: ${data.weight} kg | BMI: ${data.bmi}`;
    }
  })
  .catch(err => {
    document.getElementById("result").innerText = "Request failed";
  });
}
</script>

</body>
</html>
